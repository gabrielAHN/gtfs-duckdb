extension:
  name: gtfs
  description: GTFS transit feed normalization, analysis, pathfinding and route geometry functions
  version: 1.0.1
  language: C++
  build: cmake
  license: MIT
  maintainers:
    - gabrielAHN

repo:
  github: gabrielAHN/gtfs-duckdb
  ref: REPLACE_WITH_MERGED_MAIN_COMMIT

docs:
  hello_world: |
    SELECT route_type_to_name(3);
  extended_description: |
    GTFS DuckDB (gtfs) registers GTFS transit functions at LOAD and exposes explicit dataset lifecycle pragmas:
    PRAGMA gtfs_prepare, PRAGMA gtfs_init and PRAGMA gtfs_refresh. Loading does not create or reset tables.
